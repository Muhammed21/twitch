name: twitch

# Environnement local (ADR 0028). Profil par défaut : infrastructure seulement,
# les applications tournent sur l'hôte avec `pnpm dev`. Le profil `full` ajoute
# les images des applications : migrate, puis api et outbox-relay (§5).

x-postgres-client-env: &postgres-client-env
  PGHOST: postgres
  PGPASSWORD: ${POSTGRES_PASSWORD}

x-api-image: &api-image
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: api
  image: twitch-api:local
  stop_grace_period: 45s

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  db-init:
    image: postgres:17.11-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-client-env
      PG_PASSWORD_MIGRATOR: ${PG_PASSWORD_MIGRATOR}
      PG_PASSWORD_APP_IDENTITY: ${PG_PASSWORD_APP_IDENTITY}
      PG_PASSWORD_APP_CHANNEL: ${PG_PASSWORD_APP_CHANNEL}
      PG_PASSWORD_APP_STREAM: ${PG_PASSWORD_APP_STREAM}
      PG_PASSWORD_APP_CHAT: ${PG_PASSWORD_APP_CHAT}
      PG_PASSWORD_APP_MODERATION: ${PG_PASSWORD_APP_MODERATION}
      PG_PASSWORD_APP_DISCOVERY: ${PG_PASSWORD_APP_DISCOVERY}
      PG_PASSWORD_APP_MONETIZATION: ${PG_PASSWORD_APP_MONETIZATION}
      PG_PASSWORD_APP_NOTIFICATION: ${PG_PASSWORD_APP_NOTIFICATION}
      PG_PASSWORD_APP_VIDEO: ${PG_PASSWORD_APP_VIDEO}
      PG_PASSWORD_APP_OUTBOX_RELAY: ${PG_PASSWORD_APP_OUTBOX_RELAY}
      PG_PASSWORD_APP_HEALTH: ${PG_PASSWORD_APP_HEALTH}
      PG_PASSWORD_PAYLOAD: ${PG_PASSWORD_PAYLOAD}
    volumes:
      - ./docker/postgres/init-roles.sh:/init-roles.sh:ro
    entrypoint: ["sh", "/init-roles.sh"]
    restart: "no"

  migrate:
    profiles: [full]
    build:
      context: .
      dockerfile: packages/db/Dockerfile
      target: migrate
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_MIGRATOR: postgresql://migrator:${PG_PASSWORD_MIGRATOR}@postgres:5432/app
    restart: "no"

  api:
    <<: *api-image
    profiles: [full]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      API_PORT: "3000"
      DATABASE_URL_IDENTITY: postgresql://app_identity:${PG_PASSWORD_APP_IDENTITY}@postgres:5432/app
      DATABASE_URL_CHANNEL: postgresql://app_channel:${PG_PASSWORD_APP_CHANNEL}@postgres:5432/app
      DATABASE_URL_STREAM: postgresql://app_stream:${PG_PASSWORD_APP_STREAM}@postgres:5432/app
      DATABASE_URL_MODERATION: postgresql://app_moderation:${PG_PASSWORD_APP_MODERATION}@postgres:5432/app
      DATABASE_URL_HEALTH: postgresql://app_health:${PG_PASSWORD_APP_HEALTH}@postgres:5432/app
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://127.0.0.1:${API_PORT:-3000}
      REDIS_URL: redis://redis:6379
      VIDEO_WEBHOOK_SECRET: ${VIDEO_WEBHOOK_SECRET}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30

  outbox-relay:
    <<: *api-image
    profiles: [full]
    command: ["node", "apps/api/dist/outbox-relay/main.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL_OUTBOX_RELAY: postgresql://app_outbox_relay:${PG_PASSWORD_APP_OUTBOX_RELAY}@postgres:5432/app
      REDIS_URL: redis://redis:6379

  redis:
    image: redis:8.8.3-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:4.47
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./docker/seaweedfs/start.sh:/start.sh:ro
      - s3-data:/data
    entrypoint: ["sh", "/start.sh"]
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 60

  s3-init:
    image: chrislusf/seaweedfs:4.47
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./docker/seaweedfs/create-bucket.sh:/create-bucket.sh:ro
    entrypoint: ["sh", "/create-bucket.sh"]
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  s3-data:
