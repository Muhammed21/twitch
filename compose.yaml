name: twitch

# Environnement local (ADR 0028). Profil par défaut : infrastructure seulement,
# les applications tournent sur l'hôte avec `pnpm dev`. Le profil `full`
# (images des applications) sera ajouté avec la première tranche de chaque app.

x-postgres-client-env: &postgres-client-env
  PGHOST: postgres
  PGPASSWORD: ${POSTGRES_PASSWORD}

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  db-init:
    image: postgres:17.11-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-client-env
      PG_PASSWORD_MIGRATOR: ${PG_PASSWORD_MIGRATOR}
      PG_PASSWORD_APP_IDENTITY: ${PG_PASSWORD_APP_IDENTITY}
      PG_PASSWORD_APP_CHANNEL: ${PG_PASSWORD_APP_CHANNEL}
      PG_PASSWORD_APP_STREAM: ${PG_PASSWORD_APP_STREAM}
      PG_PASSWORD_APP_CHAT: ${PG_PASSWORD_APP_CHAT}
      PG_PASSWORD_APP_MODERATION: ${PG_PASSWORD_APP_MODERATION}
      PG_PASSWORD_APP_DISCOVERY: ${PG_PASSWORD_APP_DISCOVERY}
      PG_PASSWORD_APP_MONETIZATION: ${PG_PASSWORD_APP_MONETIZATION}
      PG_PASSWORD_APP_NOTIFICATION: ${PG_PASSWORD_APP_NOTIFICATION}
      PG_PASSWORD_APP_OUTBOX_RELAY: ${PG_PASSWORD_APP_OUTBOX_RELAY}
      PG_PASSWORD_APP_HEALTH: ${PG_PASSWORD_APP_HEALTH}
      PG_PASSWORD_PAYLOAD: ${PG_PASSWORD_PAYLOAD}
    volumes:
      - ./docker/postgres/init-roles.sh:/init-roles.sh:ro
    entrypoint: ["sh", "/init-roles.sh"]
    restart: "no"

  redis:
    image: redis:8.8.3-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:4.47
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./docker/seaweedfs/start.sh:/start.sh:ro
      - s3-data:/data
    entrypoint: ["sh", "/start.sh"]
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 60

  s3-init:
    image: chrislusf/seaweedfs:4.47
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./docker/seaweedfs/create-bucket.sh:/create-bucket.sh:ro
    entrypoint: ["sh", "/create-bucket.sh"]
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  s3-data:
