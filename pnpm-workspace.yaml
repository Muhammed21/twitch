packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: false
  prisma: true

# Dépendances du CLI prisma 7.10.0 corrigées par GHSA-3f6p-5ww8-9rcr et GHSA-ggr8-5vv4-36mx.
# À retirer quand une version de prisma les embarque.
overrides:
  "prisma>mysql2": 3.24.5
  "@prisma/config>deepmerge-ts": 8.0.2
  # @nestjs/swagger 11.4.7 épingle js-yaml 5.3.0, vulnérable ; 5.4.3 corrige, même branche 5.x.
  "@nestjs/swagger>js-yaml": 5.4.3
  # @nestjs/platform-express 11.2.8 épingle multer 2.4.0 et express 5.2.1 (body-parser < 2.4.0), vulnérables ;
  # multer 2.5.0 et express 5.3.0 corrigent, mêmes branches. À retirer quand Nest 11 les embarque.
  "@nestjs/platform-express>multer": 2.5.0
  "@nestjs/platform-express>express": 5.3.0
  # vitest 4.1.12 accepte vite ^8 mais le lockfile restait sur 8.3.0, vulnérable ; 8.3.5 corrige.
  "vite@>=8.3.0 <8.3.3": 8.3.5
