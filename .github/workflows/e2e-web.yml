name: E2E Web

on:
  workflow_call:
    inputs:
      shards:
        description: JSON list of {project, index, total}, one entry per job
        type: string
        required: true
  workflow_dispatch:
    inputs:
      shards:
        description: JSON list of {project, index, total}, one entry per job
        type: string
        default: '[{"project":"webkit","index":1,"total":1},{"project":"mobile-safari","index":1,"total":1}]'

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (${{ matrix.project }} ${{ matrix.index }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.shards) }}
    env:
      E2E_WEB_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Detect changes that reach this job
        id: changes
        run: |
          if [ "${{ github.event_name }}" != pull_request ] || ! git diff --quiet HEAD^1 -- apps packages e2e package.json pnpm-lock.yaml pnpm-workspace.yaml turbo.json .github/workflows/ci.yml .github/workflows/e2e-web.yml .github/actions \
              ':!*.test.ts' ':!*.test.tsx' ':!*.md' ':!packages/design-tokens/bench'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/install
        if: steps.changes.outputs.run == 'true'
      - name: Install Playwright browser
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @repo/e2e exec playwright install --with-deps ${{ matrix.project == 'chromium' && 'chromium' || 'webkit' }}
      # no `--` before the flag: pnpm forwards it to playwright, which then reads the flag as a file filter
      - name: Run Playwright (${{ matrix.project }})
        if: steps.changes.outputs.run == 'true'
        run: pnpm e2e:all --project=${{ matrix.project }} --shard=${{ matrix.index }}/${{ matrix.total }}
        env:
          E2E_START_SERVERS: "1"
          CI: "1"
      - name: Upload Playwright artifacts
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces-${{ matrix.project }}-${{ matrix.index }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
