name: ffmpeg statique
description: Installe ffmpeg et ffprobe depuis un build statique épinglé par somme SHA-256, mis en cache.
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        echo "tag=autobuild-2026-09-30-13-08" >> "$GITHUB_OUTPUT"
        echo "name=ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1" >> "$GITHUB_OUTPUT"
        echo "sha256=97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/ffmpeg
        key: ffmpeg-${{ steps.pin.outputs.sha256 }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TAG: ${{ steps.pin.outputs.tag }}
        NAME: ${{ steps.pin.outputs.name }}
        SHA256: ${{ steps.pin.outputs.sha256 }}
      run: |
        archive="$RUNNER_TEMP/ffmpeg.tar.xz"
        curl -fsSL --retry 3 -o "$archive" \
          "https://github.com/BtbN/FFmpeg-Builds/releases/download/$TAG/$NAME.tar.xz"
        printf '%s  %s\n' "$SHA256" "$archive" | shasum -a 256 -c
        mkdir -p "$RUNNER_TEMP/ffmpeg"
        tar -xJf "$archive" -C "$RUNNER_TEMP/ffmpeg" --strip-components=2 "$NAME/bin/ffmpeg" "$NAME/bin/ffprobe"
        rm "$archive"
    - shell: bash
      run: |
        echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/ffmpeg/ffprobe" -version | head -1
