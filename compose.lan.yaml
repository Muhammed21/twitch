# Test sur iPhone réel (ADR 0028, ADR 0031) : republie sur toutes les interfaces les ports
# que l'app joint, et seulement eux, le temps du test.
# docker compose -f compose.yaml -f compose.lan.yaml --profile full up -d --build --wait api chat video
# VIDEO_PLAYBACK_BASE_URL, dans .env, prend alors l'adresse de la machine sur le réseau local
# (http://<adresse>:3002) : c'est l'URL que l'iPhone joint pour lire le live.
# Pour envoyer une image (ADR 0044), S3_PUBLIC_ENDPOINT (http://<adresse>:8333) et
# S3_PUBLIC_BASE_URL (http://<adresse>:8333/twitch-local) prennent aussi cette adresse.
# BETTER_AUTH_URL (http://<adresse>:<API_PORT>) aussi : les pages de connexion refusent (403)
# un formulaire dont l'origine n'est pas celle de l'API, et la ressource OAuth en dépend.

services:
  api:
    ports: !override
      - "${API_PORT:-3000}:3000"
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL doit prendre l'adresse de la machine sur le réseau local}

  chat:
    ports: !override
      - "${CHAT_HTTP_PORT:-3001}:3001"

  video:
    ports: !override
      - "${VIDEO_RTMP_PORT:-1935}:1935"
      - "${VIDEO_HTTP_PORT:-3002}:3002"

  s3:
    ports: !override
      - "${S3_PORT:-8333}:8333"
