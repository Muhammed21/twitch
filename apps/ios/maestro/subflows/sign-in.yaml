appId: com.muhammedcavus.twitch
---
# La feuille web de connexion reste parfois blanche sur le simulateur de la CI. Sur le runner
# chargé, le processus WebContent de SafariViewService a mis jusqu'à 38 s à démarrer (run
# 41831254362), contre moins d'une seconde d'habitude, et la page n'est demandée qu'ensuite :
# « Username » s'attend donc jusqu'à 90 s. Relancer l'app trop tôt jetait le processus en cours de
# démarrage. La relance reste un dernier recours.
- retry:
    maxRetries: 1
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
      - extendedWaitUntil:
          visible:
            id: welcome.logIn
          timeout: 30000
      - tapOn:
          id: welcome.logIn
      - extendedWaitUntil:
          visible: Username
          timeout: 90000
# « Username » nomme deux éléments de la page : le <label>, puis le champ juste en dessous. Sur le
# runner chargé, un toucher sur le libellé laissait parfois le champ sans focus et la saisie partait
# dans le vide : le flow vise donc le second élément, et vérifie la valeur saisie avant de continuer.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: Username
          index: 1
      - eraseText
      - inputText: viewer@twitch.local
      - assertVisible: viewer@twitch.local
- tapOn:
    text: Password
    index: 1
- inputText: twitch-dev-password
- pressKey: Enter
# Sur le runner macOS, le hachage du mot de passe et l'échange du code prennent parfois plus de 30 s.
- extendedWaitUntil:
    visible:
      id: root.account
    timeout: 90000
