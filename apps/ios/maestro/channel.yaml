appId: com.muhammedcavus.twitch
name: Page de chaîne
---
- runFlow: subflows/sign-in.yaml
- runFlow: subflows/open-live-channel.yaml
- extendedWaitUntil:
    visible:
      id: channel.header
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: channel.live
    timeout: 30000
- assertVisible:
    id: player.surface
